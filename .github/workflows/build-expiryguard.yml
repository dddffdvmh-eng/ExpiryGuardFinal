name: Build ExpiryGuard APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Build ExpiryGuard 2.0
        run: |
          python3 -c '
          import os, zlib, base64
          def w(p, b):
              if os.path.dirname(p): os.makedirs(os.path.dirname(p), exist_ok=True)
              open(p, "wb").write(zlib.decompress(base64.b64decode(b)))

          w("settings.gradle.kts", "eJwryClNz8zLy0xPTc1NzStRsK4uyC9OLSpW0s/PT88vTc1J1dQ0tNA00tQwNjfSM9A0MTQ11tRU00jN10hO10wty0xJzUtJzEnOz88p1tTU0MjOz0hNTs1JzEtJTclP00gF6dLSNDDT1FQzM9fU1FTTKLbQUlPTr85J1dQ0tNA00jTQ0AAAB2Q24g==")
          w("build.gradle.kts", "eJwryClNz8zLy0xPTc1NzStRsK4uyC9OLSpW0s/PT88vTc1J1dQ0tNA00tQwNjfSM9A0MTQ11tRU00jN10hO10wty0xJzUtJzEnOz88p1tTU0MjOz0hNTs1JzEtJTclP00gF6dLSNDDT1FQzM9fU1FTTKLbQUlPTr85J1dQ0tNA00jTQ0AAAB2Q24g==")
          w("gradle.properties", "eJzLyy/K1kvPT88vTc1J1dQ0tNA00tQwNjfSM9A0MTQ11tRU00jN10hO10wty0xJzUtJzEnOz88p1tTU0MjOz0hNTs1JzEtJTclP00gF6dLSNDDT1FQzM9fU1FTTKLbQUlPTr85J1dQ0tNA00jTQ0AAAB2Q24g==")
          '
          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "ExpiryGuard2"
          include(":app")
          EOF
          cat << 'EOF' > build.gradle.kts
          plugins { id("com.android.application") version "8.2.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.22" apply false }
          EOF
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF
          mkdir -p app/src/main/java/com/expiryguard/app app/src/main/res/values
          cat << 'EOF' > app/build.gradle.kts
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android { namespace = "com.expiryguard.app"; compileSdk = 34; defaultConfig { applicationId = "com.expiryguard.app"; minSdk = 26; targetSdk = 34; versionCode = 1; versionName = "2.0" }; compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }; kotlinOptions { jvmTarget = "17" }; buildFeatures { compose = true }; composeOptions { kotlinCompilerExtensionVersion = "1.5.8" } }
          dependencies { implementation("androidx.core:core-ktx:1.12.0"); implementation("androidx.activity:activity-compose:1.8.2"); implementation(platform("androidx.compose:compose-bom:2024.02.00")); implementation("androidx.compose.ui:ui"); implementation("androidx.compose.material3:material3"); implementation("androidx.compose.material:material-icons-extended"); implementation("com.google.code.gson:gson:2.10.1") }
          EOF
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?><resources><style name="Theme.ExpiryGuard" parent="android:Theme.Material.NoActionBar"/></resources>
          EOF
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://android.com"><application android:allowBackup="true" android:label="حارس الصلاحية 2.0" android:supportsRtl="true" android:theme="@style/Theme.ExpiryGuard"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          cat << 'EOF' > app/src/main/java/com/expiryguard/app/MainActivity.kt
          package com.expiryguard.app
          import android.app.DatePickerDialog; import android.content.Context; import android.os.Bundle; import android.widget.Toast
          import androidx.activity.ComponentActivity; import androidx.activity.compose.setContent
          import androidx.compose.foundation.*; import androidx.compose.foundation.layout.*; import androidx.compose.foundation.lazy.*; import androidx.compose.material.icons.Icons; import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*; import androidx.compose.runtime.*; import androidx.compose.ui.*; import androidx.compose.ui.graphics.Color; import androidx.compose.ui.platform.*; import androidx.compose.ui.text.font.FontWeight; import androidx.compose.ui.unit.*
          import com.google.gson.Gson; import com.google.gson.reflect.TypeToken; import java.text.SimpleDateFormat; import java.util.*; import java.util.concurrent.TimeUnit
          data class Item(val id: Long, val name: String, val qty: Int, val prod: Long, val exp: Long, val note: String)
          class MainActivity : ComponentActivity() {
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  setContent {
                      val ctx = LocalContext.current; val prefs = remember { ctx.getSharedPreferences("eg", Context.MODE_PRIVATE) }; val gson = remember { Gson() }
                      var items by remember { mutableStateOf<List<Item>>(gson.fromJson(prefs.getString("d", "[]"), object : TypeToken<List<Item>>() {}.type)) }
                      fun save(l: List<Item>) { items = l; prefs.edit().putString("d", gson.toJson(l)).apply() }
                      var add by remember { mutableStateOf(false) }; var q by remember { mutableStateOf("") }
                      CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Rtl) {
                          MaterialTheme(colorScheme = darkColorScheme(primary = Color(0xFF10B981), background = Color(0xFF0A1128), surface = Color(0xFF14213D))) {
                              Scaffold(topBar = { TopAppBar(title = { Text("حارس الصلاحية 2.0", fontWeight = FontWeight.Bold) }) }, floatingActionButton = { FloatingActionButton(onClick = { add = true }, containerColor = Color(0xFF10B981)) { Icon(Icons.Default.Add, null, tint = Color.White) } }) { p ->
                                  if (add) {
                                      var nm by remember { mutableStateOf("") }; var qt by remember { mutableStateOf("1") }; var nt by remember { mutableStateOf("") }
                                      var pr by remember { mutableLongStateOf(System.currentTimeMillis()) }; var ex by remember { mutableLongStateOf(System.currentTimeMillis() + TimeUnit.DAYS.toMillis(30)) }
                                      val sdf = SimpleDateFormat("dd/MM/yyyy", Locale("ar"))
                                      Column(Modifier.padding(p).padding(16.dp).verticalScroll(rememberScrollState()), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                                          Text("إضافة منتج جديد", fontSize = 20.sp, fontWeight = FontWeight.Bold)
                                          OutlinedTextField(nm, { nm = it }, label = { Text("اسم المنتج") }, modifier = Modifier.fillMaxWidth())
                                          OutlinedTextField(qt, { qt = it }, label = { Text("الكمية") }, modifier = Modifier.fillMaxWidth())
                                          Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                              OutlinedButton(onClick = { val c = Calendar.getInstance().apply { timeInMillis = pr }; DatePickerDialog(ctx, { _, y, m, d -> c.set(y, m, d); pr = c.timeInMillis }, c.get(1), c.get(2), c.get(5)).show() }, modifier = Modifier.weight(1f)) { Text("الإنتاج: ${sdf.format(Date(pr))}") }
                                              OutlinedButton(onClick = { val c = Calendar.getInstance().apply { timeInMillis = ex }; DatePickerDialog(ctx, { _, y, m, d -> c.set(y, m, d); ex = c.timeInMillis }, c.get(1), c.get(2), c.get(5)).show() }, modifier = Modifier.weight(1f)) { Text("الانتهاء: ${sdf.format(Date(ex))}") }
                                          }
                                          OutlinedTextField(nt, { nt = it }, label = { Text("ملاحظات") }, modifier = Modifier.fillMaxWidth())
                                          Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                              Button(onClick = { if (nm.isNotBlank() && ex > pr) { save(items + Item(System.currentTimeMillis(), nm, qt.toIntOrNull() ?: 1, pr, ex, nt)); add = false } else Toast.makeText(ctx, "تأكد من الاسم والتاريخ", Toast.LENGTH_SHORT).show() }, colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF10B981)), modifier = Modifier.weight(1f)) { Text("حفظ") }
                                              OutlinedButton(onClick = { add = false }, modifier = Modifier.weight(1f)) { Text("إلغاء") }
                                          }
                                      }
                                  } else {
                                      val now = System.currentTimeMillis(); val sdf = SimpleDateFormat("dd/MM/yyyy", Locale("ar"))
                                      Column(Modifier.padding(p).padding(16.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                                          Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                              Card(Modifier.weight(1f)) { Column(Modifier.padding(12.dp)) { Text("الكل", fontSize = 12.sp); Text("${items.size}", fontSize = 22.sp, fontWeight = FontWeight.Bold, color = Color(0xFF10B981)) } }
