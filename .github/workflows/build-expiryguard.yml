name: Build ExpiryGuard APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      
      

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Generate Complete Project
        run: |
          mkdir -p app/src/main/java/com/expiryguard/app/data/local
          mkdir -p app/src/main/java/com/expiryguard/app/notifications
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ExpiryGuard2"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
              id("com.google.devtools.ksp") version "1.9.22-1.0.17" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("com.google.devtools.ksp")
          }
          android {
              namespace = "com.expiryguard.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.expiryguard.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "2.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.8" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.room:room-runtime:2.6.1")
              implementation("androidx.room:room-ktx:2.6.1")
              ksp("androidx.room:room-compiler:2.6.1")
              implementation("androidx.camera:camera-core:1.3.1")
              implementation("androidx.camera:camera-camera2:1.3.1")
              implementation("androidx.camera:camera-lifecycle:1.3.1")
              implementation("androidx.camera:camera-view:1.3.1")
              implementation("androidx.work:work-runtime-ktx:2.9.0")
              implementation("io.coil-kt:coil-compose:2.5.0")
              implementation("com.google.code.gson:gson:2.10.1")
          }
          EOF

          cat << 'EOF' > app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <files-path name="my_images" path="images/" />
              <cache-path name="my_exports" path="/" />
          </paths>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.ExpiryGuard" parent="android:Theme.Material.NoActionBar" />
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com">
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <application
                  android:name=".ExpiryGuardApp"
                  android:allowBackup="true"
                  android:label="حارس الصلاحية 2.0"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.ExpiryGuard">
                  <activity android:name=".MainActivity" android:exported="true" android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <receiver android:name=".notifications.BootReceiver" android:enabled="true" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.BOOT_COMPLETED" /></intent-filter>
                  </receiver>
                  <provider android:name="androidx.core.content.FileProvider" android:authorities="${applicationId}.fileprovider" android:exported="false" android:grantUriPermissions="true">
                      <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/expiryguard/app/ExpiryGuardApp.kt
          package com.expiryguard.app
          import android.app.Application
          class ExpiryGuardApp : Application()
          EOF

          cat << 'EOF' > app/src/main/java/com/expiryguard/app/data/local/ProductEntity.kt
          package com.expiryguard.app.data.local
          import androidx.room.*
          import kotlinx.coroutines.flow.Flow

          enum class ProductStatus { VALID, EXPIRING_SOON, EXPIRED }

          @Entity(tableName = "products")
          data class ProductEntity(
              @PrimaryKey(autoGenerate = true) val id: Long = 0,
              val name: String,
              val barcode: String? = null,
              val category: String,
              val quantity: Int,
              val productionDate: Long,
              val expirationDate: Long,
              val imagePath: String? = null,
              val storageLocation: String? = null,
              val notes: String? = null,
              val reminderDays: String = "30,7,3,1,0",
              val needsFollowUp: Boolean = false
          )

          @Dao
          interface ProductDao {
              @Query("SELECT * FROM products ORDER BY expirationDate ASC")
              fun getAllProducts(): Flow<List<ProductEntity>>
              @Query("SELECT * FROM products")
              suspend fun getAllProductsSync(): List<ProductEntity>
              @Insert(onConflict = OnConflictStrategy.REPLACE)
              suspend fun insertProduct(product: ProductEntity): Long
              @Delete
              suspend fun deleteProduct(product: ProductEntity)
              @Insert(onConflict = OnConflictStrategy.REPLACE)
              suspend fun insertAll(products: List<ProductEntity>)
          }

          @Database(entities = [ProductEntity::class], version = 1, exportSchema = false)
          abstract class AppDatabase : RoomDatabase() {
              abstract fun productDao(): ProductDao
              companion object {
                  @Volatile private var INSTANCE: AppDatabase? = null
                  fun getDatabase(context: android.content.Context): AppDatabase {
                      return INSTANCE ?: synchronized(this) {
                          Room.databaseBuilder(context.applicationContext, AppDatabase::class.java, "expiry_guard_db").build().also { INSTANCE = it }
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/expiryguard/app/notifications/NotificationScheduler.kt
          package com.expiryguard.app.notifications
          import android.app.*
          import android.content.*
          import android.os.Build
          import androidx.core.app.NotificationCompat
          import androidx.work.*
          import com.expiryguard.app.data.local.*
          import kotlinx.coroutines.*
          import java.text.SimpleDateFormat
          import java.util.*
          import java.util.concurrent.TimeUnit

          class ExpirationWorker(private val context: Context, params: WorkerParameters) : CoroutineWorker(context, params) {
              override suspend fun doWork(): Result {
                  val name = inputData.getString("product_name") ?: return Result.failure()
                  val exp = inputData.getString("exp_date") ?: ""
                  val id = inputData.getLong("product_id", 0L).toInt() + inputData.getInt("days_before", 0)
                  val manager = context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
          cat << 'EOF' > app/src/main/java/com/expiryguard/app/MainActivity.kt
          package com.expiryguard.app

          import android.Manifest
          import android.app.DatePickerDialog
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Paint
          import android.graphics.pdf.PdfDocument
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.camera.core.*
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.camera.view.PreviewView
          import androidx.compose.foundation.*
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.*
          import androidx.compose.foundation.shape.*
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.*
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.platform.*
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.*
          import androidx.compose.ui.viewinterop.AndroidView
          import androidx.core.content.*
          import coil.compose.rememberAsyncImagePainter
          import com.expiryguard.app.data.local.*
          import com.expiryguard.app.notifications.NotificationScheduler
          import com.google.gson.Gson
          import com.google.gson.reflect.TypeToken
          import kotlinx.coroutines.launch
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.*
          import java.util.concurrent.TimeUnit

          val DarkNavyBg = Color(0xFF0A1128)
          val NavyCard = Color(0xFF14213D)
          val EmeraldGreen = Color(0xFF10B981)
          val WarningAmber = Color(0xFFF59E0B)
          val DangerRed = Color(0xFFEF4444)

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      var isDark by remember { mutableStateOf(true) }
                      val colors = if (isDark) darkColorScheme(primary = EmeraldGreen, background = DarkNavyBg, surface = NavyCard, onBackground = Color.White, onSurface = Color.White)
                                   else lightColorScheme(primary = EmeraldGreen, background = Color(0xFFF1F5F9), surface = Color.White)
                      CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Rtl) {
                          MaterialTheme(colorScheme = colors) {
                              MainApp(isDark) { isDark = !isDark }
                          }
                      }
                  }
              }
          }

          fun getStatus(exp: Long): ProductStatus {
              val now = System.currentTimeMillis()
              val diff = TimeUnit.MILLISECONDS.toDays(exp - now)
              return when {
                  exp < now -> ProductStatus.EXPIRED
                  diff <= 15 -> ProductStatus.EXPIRING_SOON
                  else -> ProductStatus.VALID
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun MainApp(isDark: Boolean, onToggleTheme: () -> Unit) {
              val ctx = LocalContext.current
              val db = remember { AppDatabase.getDatabase(ctx) }
              val products by db.productDao().getAllProducts().collectAsState(initial = emptyList())
              val scope = rememberCoroutineScope()
              var tab by remember { mutableIntStateOf(0) }
              var editItem by remember { mutableStateOf<ProductEntity?>(null) }
              var showForm by remember { mutableStateOf(false) }
              var detailItem by remember { mutableStateOf<ProductEntity?>(null) }
              var notifEnabled by remember { mutableStateOf(true) }
              var defRem by remember { mutableStateOf("30,7,3,1,0") }

              val notifLauncher = rememberLauncherForActivityResult(ActivityResultContracts.RequestPermission()) {}
              LaunchedEffect(Unit) {
                  if (Build.VERSION.SDK_INT >= 33 && ContextCompat.checkSelfPermission(ctx, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      notifLauncher.launch(Manifest.permission.POST_NOTIFICATIONS)
                  }
              }

              if (showForm) {
                  ProductForm(editItem, defRem, onSave = { p ->
                      scope.launch {
                          val id = db.productDao().insertProduct(p)
                          val saved = p.copy(id = if (p.id == 0L) id else p.id)
                          if (notifEnabled) NotificationScheduler.scheduleProductReminders(ctx, saved)
                          else NotificationScheduler.cancelProductReminders(ctx, saved.id)
                          showForm = false; editItem = null
                      }
                  }, onCancel = { showForm = false; editItem = null })
                  return
              }

              detailItem?.let { p ->
                  DetailsView(p, onBack = { detailItem = null }, onEdit = { editItem = p; detailItem = null; showForm = true }, onDelete = {
                      scope.launch { NotificationScheduler.cancelProductReminders(ctx, p.id); db.productDao().deleteProduct(p); detailItem = null }
                  })
                  return
              }

              Scaffold(
                  topBar = { TopAppBar(title = { Text("حارس الصلاحية 2.0", fontWeight = FontWeight.Bold) }, colors = TopAppBarDefaults.topAppBarColors(containerColor = MaterialTheme.colorScheme.surface)) },
                  floatingActionButton = {
                      if (tab < 2) FloatingActionButton(onClick = { editItem = null; showForm = true }, containerColor = EmeraldGreen) {
                          Icon(Icons.Default.Add, contentDescription = null, tint = Color.White)
                      }
                  },
                  bottomBar = {
                      NavigationBar(containerColor = MaterialTheme.colorScheme.surface) {
                          NavigationBarItem(selected = tab == 0, onClick = { tab = 0 }, icon = { Icon(Icons.Default.Dashboard, null) }, label = { Text("الرئيسية") })
                          NavigationBarItem(selected = tab == 1, onClick = { tab = 1 }, icon = { Icon(Icons.Default.Inventory, null) }, label = { Text("المنتجات") })
                          NavigationBarItem(selected = tab == 2, onClick = { tab = 2 }, icon = { Icon(Icons.Default.Assessment, null) }, label = { Text("التقارير") })
                          NavigationBarItem(selected = tab == 3, onClick = { tab = 3 }, icon = { Icon(Icons.Default.Settings, null) }, label = { Text("الإعدادات") })
                      }
                  }
              ) { pad ->
                  Box(Modifier.padding(pad).fillMaxSize()) {
                      when (tab) {
                          0 -> DashboardView(products) { detailItem = it }
                          1 -> ListView(products) { detailItem = it }
                          2 -> ReportsView(products)
                          3 -> SettingsView(isDark, onToggleTheme, notifEnabled, { notifEnabled = it }, defRem, { defRem = it }, products) { list ->
                              scope.launch { db.productDao().insertAll(list); list.forEach { NotificationScheduler.scheduleProductReminders(ctx, it) } }
                          }
                      }
                  }
              }
          }

          @Composable
          fun DashboardView(products: List<ProductEntity>, onClick: (ProductEntity) -> Unit) {
              val valid = products.count { getStatus(it.expirationDate) == ProductStatus.VALID }
              val soon = products.count { getStatus(it.expirationDate) == ProductStatus.EXPIRING_SOON }
              val expired = products.count { getStatus(it.expirationDate) == ProductStatus.EXPIRED }
              LazyColumn(Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                  item { StatCard("إجمالي المنتجات", "${products.size}", EmeraldGreen) }
                  item {
                      Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                          Box(Modifier.weight(1f)) { StatCard("المنتجات الصالحة", "$valid", EmeraldGreen) }
                          Box(Modifier.weight(1f)) { StatCard("تنتهي قريباً", "$soon", WarningAmber) }
                      }
                  }
                  item {
                      Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                          Box(Modifier.weight(1f)) { StatCard("منتهية الصلاحية", "$expired", DangerRed) }
                          Box(Modifier.weight(1f)) { StatCard("تحتاج لمتابعة", "${soon + expired}", Color(0xFF3B82F6)) }
                      }
                  }
                  items(products.take(10)) { ProductCard(it) { onClick(it) } }
              }
          }

          @Composable
          fun StatCard(title: String, count: String, color: Color) {
              Card(Modifier.fillMaxWidth(), colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface)) {
                  Column(Modifier.padding(16.dp)) {
                      Text(title, fontSize = 13.sp, color = Color.Gray)
                      Text(count, fontSize = 26.sp, fontWeight = FontWeight.Bold, color = color)
                  }
              }
          }

          @Composable
          fun ListView(products: List<ProductEntity>, onClick: (ProductEntity) -> Unit) {
              var q by remember { mutableStateOf("") }
              var f by remember { mutableStateOf("الكل") }
              val list = products.filter {
                  (it.name.contains(q, true) || (it.barcode?.contains(q) == true)) &&
                  when (f) { "صالح" -> getStatus(it.expirationDate) == ProductStatus.VALID; "قريباً" -> getStatus(it.expirationDate) == ProductStatus.EXPIRING_SOON; "منتهي" -> getStatus(it.expirationDate) == ProductStatus.EXPIRED; else -> true }
              }
              Column(Modifier.fillMaxSize().padding(16.dp)) {
                  OutlinedTextField(value = q, onValueChange = { q = it }, label = { Text("بحث بالاسم أو الباركود") }, modifier = Modifier.fillMaxWidth())
                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      listOf("الكل", "صالح", "قريباً", "منتهي").forEach { tag -> FilterChip(selected = f == tag, onClick = { f = tag }, label = { Text(tag) }) }
                  }
                  LazyColumn(verticalArrangement = Arrangement.spacedBy(8.dp)) { items(list) { ProductCard(it) { onClick(it) } } }
              }
          }

          @Composable
          fun ProductCard(p: ProductEntity, onClick: () -> Unit) {
              val st = getStatus(p.expirationDate)
              val col = when (st) { ProductStatus.VALID -> EmeraldGreen; ProductStatus.EXPIRING_SOON -> WarningAmber; ProductStatus.EXPIRED -> DangerRed }
              val txt = when (st) { ProductStatus.VALID -> "صالح"; ProductStatus.EXPIRING_SOON -> "قريباً"; ProductStatus.EXPIRED -> "منتهي" }
              val sdf = remember { SimpleDateFormat("dd/MM/yyyy", Locale("ar")) }
              Card(Modifier.fillMaxWidth().clickable { onClick() }, colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface)) {
                  Row(Modifier.padding(12.dp), verticalAlignment = Alignment.CenterVertically) {
                      if (!p.imagePath.isNullOrEmpty()) Image(rememberAsyncImagePainter(File(p.imagePath)), null, Modifier.size(56.dp).clip(RoundedCornerShape(8.dp)), contentScale = ContentScale.Crop)
                      else Box(Modifier.size(56.dp).background(Color.DarkGray, RoundedCornerShape(8.dp)), contentAlignment = Alignment.Center) { Icon(Icons.Default.Inventory2, null, tint = Color.White) }
                      Spacer(Modifier.width(12.dp))
                      Column(Modifier.weight(1f)) {
                          Text(p.name, fontWeight = FontWeight.Bold)
                          Text("الكمية: ${p.quantity} | الانتهاء: ${sdf.format(Date(p.expirationDate))}", fontSize = 12.sp, color = Color.Gray)
                      }
                      Text(txt, color = col, fontWeight = FontWeight.Bold)
                  }
              }
          }

          @Composable
          fun ProductForm(existing: ProductEntity?, defRem: String, onSave: (ProductEntity) -> Unit, onCancel: () -> Unit) {
              val ctx = LocalContext.current
              var name by remember { mutableStateOf(existing?.name ?: "") }
              var barcode by remember { mutableStateOf(existing?.barcode ?: "") }
              var cat by remember { mutableStateOf(existing?.category ?: "عام") }
              var qty by remember { mutableStateOf(existing?.quantity?.toString() ?: "1") }
              var loc by remember { mutableStateOf(existing?.storageLocation ?: "") }
              var notes by remember { mutableStateOf(existing?.notes ?: "") }
              var img by remember { mutableStateOf(existing?.imagePath) }
              var prod by remember { mutableLongStateOf(existing?.productionDate ?: System.currentTimeMillis()) }
              var exp by remember { mutableLongStateOf(existing?.expirationDate ?: (System.currentTimeMillis() + TimeUnit.DAYS.toMillis(30))) }
              var remDays by remember { mutableStateOf((existing?.reminderDays ?: defRem).split(",").mapNotNull { it.toIntOrNull() }.toSet()) }
              var openCam by remember { mutableStateOf(false) }

              val camPerm = rememberLauncherForActivityResult(ActivityResultContracts.RequestPermission()) { if (it) openCam = true }
              val gal = rememberLauncherForActivityResult(ActivityResultContracts.GetContent()) { uri ->
                  uri?.let {
                      val f = File(ctx.filesDir, "images/G_${System.currentTimeMillis()}.jpg").apply { parentFile?.mkdirs() }
                      ctx.contentResolver.openInputStream(it)?.use { i -> f.outputStream().use { o -> i.copyTo(o) } }
                      img = f.absolutePath
                  }
              }

              if (openCam) {
                  CameraScreen(onCaptured = { img = it; openCam = false }, onClose = { openCam = false })
                  return
              }

              val sdf = remember { SimpleDateFormat("dd/MM/yyyy", Locale("ar")) }
              Column(Modifier.fillMaxSize().background(MaterialTheme.colorScheme.background).padding(16.dp).verticalScroll(rememberScrollState()), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                  Text(if (existing == null) "إضافة منتج" else "تعديل منتج", fontSize = 20.sp, fontWeight = FontWeight.Bold)
                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      Button(onClick = {
                          if (ContextCompat.checkSelfPermission(ctx, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) openCam = true
                          else camPerm.launch(Manifest.permission.CAMERA)
                      }, colors = ButtonDefaults.buttonColors(containerColor = EmeraldGreen), modifier = Modifier.weight(1f)) { Text("كاميرا داخلية") }
                      OutlinedButton(onClick = { gal.launch("image/*") }, modifier = Modifier.weight(1f)) { Text("الاستوديو") }
                  }
                  img?.let { Image(rememberAsyncImagePainter(File(it)), null, Modifier.fillMaxWidth().height(150.dp).clip(RoundedCornerShape(10.dp)), contentScale = ContentScale.Crop) }
                  OutlinedTextField(value = name, onValueChange = { name = it }, label = { Text("اسم المنتج *") }, modifier = Modifier.fillMaxWidth())
                  OutlinedTextField(value = barcode, onValueChange = { barcode = it }, label = { Text("الباركود") }, modifier = Modifier.fillMaxWidth())
                  OutlinedTextField(value = cat, onValueChange = { cat = it }, label = { Text("التصنيف") }, modifier = Modifier.fillMaxWidth())
                  OutlinedTextField(value = qty, onValueChange = { qty = it }, label = { Text("الكمية") }, modifier = Modifier.fillMaxWidth())
                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      OutlinedButton(onClick = {
                          val c = Calendar.getInstance().apply { timeInMillis = prod }
                          DatePickerDialog(ctx, { _, y, m, d -> c.set(y, m, d); prod = c.timeInMillis }, c.get(1), c.get(2), c.get(5)).show()
                      }, modifier = Modifier.weight(1f)) { Text("الإنتاج: ${sdf.format(Date(prod))}") }
                      OutlinedButton(onClick = {
                          val c = Calendar.getInstance().apply { timeInMillis = exp }
                          DatePickerDialog(ctx, { _, y, m, d -> c.set(y, m, d); exp = c.timeInMillis }, c.get(1), c.get(2), c.get(5)).show()
                      }, modifier = Modifier.weight(1f)) { Text("الانتهاء: ${sdf.format(Date(exp))}") }
                  }
                  OutlinedTextField(value = loc, onValueChange = { loc = it }, label = { Text("الرف / الموقع") }, modifier = Modifier.fillMaxWidth())
                  OutlinedTextField(value = notes, onValueChange = { notes = it }, label = { Text("ملاحظات") }, modifier = Modifier.fillMaxWidth())
                  LazyRow(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                      items(listOf(30, 15, 10, 7, 3, 1, 0)) { d ->
                          FilterChip(selected = remDays.contains(d), onClick = { remDays = if (remDays.contains(d)) remDays - d else remDays + d }, label = { Text(if (d == 0) "نفس اليوم" else "$d يوم") })
                      }
                  }
                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      Button(onClick = {
                          if (name.isBlank() || exp <= prod) { Toast.makeText(ctx, "تأكد من الاسم وصحة التواريخ", Toast.LENGTH_SHORT).show(); return@Button }
                          onSave(ProductEntity(existing?.id ?: 0, name, barcode.ifBlank { null }, cat, qty.toIntOrNull() ?: 1, prod, exp, img, loc.ifBlank { null }, notes.ifBlank { null }, remDays.joinToString(",")))
                      }, colors = ButtonDefaults.buttonColors(containerColor = EmeraldGreen), modifier = Modifier.weight(1f)) { Text("حفظ") }
                      OutlinedButton(onClick = onCancel, modifier = Modifier.weight(1f)) { Text("إلغاء") }
                  }
              }
          }

          @Composable
          fun CameraScreen(onCaptured: (String) -> Unit, onClose: () -> Unit) {
              val ctx = LocalContext.current
              val owner = LocalLifecycleOwner.current
              var file by remember { mutableStateOf<File?>(null) }
              val cap = remember { ImageCapture.Builder().build() }
              Box(Modifier.fillMaxSize().background(Color.Black)) {
                  if (file == null) {
                      AndroidView(factory = { c ->
                          PreviewView(c).apply {
                              val f = ProcessCameraProvider.getInstance(c)
                              f.addListener({
                                  val p = f.get()
                                  val prev = Preview.Builder().build().also { it.setSurfaceProvider(surfaceProvider) }
                                  p.unbindAll(); p.bindToLifecycle(owner, CameraSelector.DEFAULT_BACK_CAMERA, prev, cap)
                              }, ContextCompat.getMainExecutor(c))
                          }
                      }, modifier = Modifier.fillMaxSize())
                      IconButton(onClick = onClose, modifier = Modifier.align(Alignment.TopEnd).padding(16.dp)) { Icon(Icons.Default.Close, null, tint = Color.White) }
                      Button(onClick = {
                          val out = File(ctx.filesDir, "images/C_${System.currentTimeMillis()}.jpg").apply { parentFile?.mkdirs() }
                          cap.takePicture(ImageCapture.OutputFileOptions.Builder(out).build(), ContextCompat.getMainExecutor(ctx), object : ImageCapture.OnImageSavedCallback {
                              override fun onImageSaved(r: ImageCapture.OutputFileResults) { file = out }
                              override fun onError(e: ImageCaptureException) {}
                          })
                      }, shape = CircleShape, colors = ButtonDefaults.buttonColors(containerColor = EmeraldGreen), modifier = Modifier.align(Alignment.BottomCenter).padding(24.dp).size(70.dp)) { Icon(Icons.Default.CameraAlt, null) }
                  } else {
                      Image(rememberAsyncImagePainter(Uri.fromFile(file)), null, Modifier.fillMaxSize())
                      Row(Modifier.align(Alignment.BottomCenter).padding(24.dp), horizontalArrangement = Arrangement.spacedBy(16.dp)) {
                          Button(onClick = { file?.delete(); file = null }, colors = ButtonDefaults.buttonColors(containerColor = DangerRed)) { Text("إعادة") }
                          Button(onClick = { file?.absolutePath?.let(onCaptured) }, colors = ButtonDefaults.buttonColors(containerColor = EmeraldGreen)) { Text("اعتماد الصورة") }
                      }
                  }
              }
          }

          @Composable
          fun DetailsView(p: ProductEntity, onBack: () -> Unit, onEdit: () -> Unit, onDelete: () -> Unit) {
              val sdf = remember { SimpleDateFormat("dd/MM/yyyy", Locale("ar")) }
              val rem = TimeUnit.MILLISECONDS.toDays(p.expirationDate - System.currentTimeMillis())
              Column(Modifier.fillMaxSize().background(MaterialTheme.colorScheme.background).padding(16.dp).verticalScroll(rememberScrollState()), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                  IconButton(onClick = onBack) { Icon(Icons.Default.ArrowForward, null) }
                  p.imagePath?.let { Image(rememberAsyncImagePainter(File(it)), null, Modifier.fillMaxWidth().height(200.dp).clip(RoundedCornerShape(12.dp)), contentScale = ContentScale.Crop) }
                  Text(p.name, fontSize = 22.sp, fontWeight = FontWeight.Bold)
                  Text("الإنتاج: ${sdf.format(Date(p.productionDate))} | الانتهاء: ${sdf.format(Date(p.expirationDate))}")
                  Text("المتبقي: $rem يوم | الكمية: ${p.quantity}")
                  Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                      Button(onClick = onEdit, colors = ButtonDefaults.buttonColors(containerColor = EmeraldGreen), modifier = Modifier.weight(1f)) { Text("تعديل") }
                      Button(onClick = onDelete, colors = ButtonDefaults.buttonColors(containerColor = DangerRed), modifier = Modifier.weight(1f)) { Text("حذف") }
                  }
              }
          }

          @Composable
          fun ReportsView(products: List<ProductEntity>) {
              val ctx = LocalContext.current
              val now = System.currentTimeMillis()
              Column(Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                  StatCard("تنتهي هذا الأسبوع", "${products.count { it.expirationDate in now..(now + TimeUnit.DAYS.toMillis(7)) }}", WarningAmber)
                  StatCard("تنتهي هذا الشهر", "${products.count { it.expirationDate in now..(now + TimeUnit.DAYS.toMillis(30)) }}", Color(0xFF3B82F6))
                  StatCard("منتهية الصلاحية", "${products.count { it.expirationDate < now }}", DangerRed)
                  Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                      Button(onClick = {
                          val f = File(ctx.cacheDir, "Report.csv").apply { writeText("\uFEFFالاسم,الكمية\n" + products.joinToString("\n") { "${it.name},${it.quantity}" }) }
                          val u = FileProvider.getUriForFile(ctx, "${ctx.packageName}.fileprovider", f)
                          ctx.startActivity(Intent.createChooser(Intent(Intent.ACTION_SEND).apply { type = "text/csv"; putExtra(Intent.EXTRA_STREAM, u); addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION) }, "تصدير CSV"))
                      }, colors = ButtonDefaults.buttonColors(containerColor = EmeraldGreen), modifier = Modifier.weight(1f)) { Text("تصدير CSV") }
                      Button(onClick = {
                          val doc = PdfDocument()
                          val page = doc.startPage(PdfDocument.PageInfo.Builder(595, 842, 1).create())
                          var y = 60f
                          products.take(25).forEach { page.canvas.drawText("${it.name} - ${it.quantity}", 40f, y, Paint().apply { textSize = 14f }); y += 25f }
                          doc.finishPage(page)
                          val f = File(ctx.cacheDir, "Report.pdf").apply { outputStream().use { doc.writeTo(it) }; doc.close() }
                          val u = FileProvider.getUriForFile(ctx, "${ctx.packageName}.fileprovider", f)
                          ctx.startActivity(Intent.createChooser(Intent(Intent.ACTION_SEND).apply { type = "application/pdf"; putExtra(Intent.EXTRA_STREAM, u); addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION) }, "تصدير PDF"))
                      }, modifier = Modifier.weight(1f)) { Text("تصدير PDF") }
                  }
              }
          }

          @Composable
          fun SettingsView(isDark: Boolean, onTheme: () -> Unit, notif: Boolean, onNotif: (Boolean) -> Unit, def: String, onDef: (String) -> Unit, products: List<ProductEntity>, onRestore: (List<ProductEntity>) -> Unit) {
              val ctx = LocalContext.current
              val launcher = rememberLauncherForActivityResult(ActivityResultContracts.GetContent()) { uri ->
                  uri?.let {
                      val txt = ctx.contentResolver.openInputStream(it)?.bufferedReader()?.readText() ?: ""
                      val list: List<ProductEntity> = Gson().fromJson(txt, object : TypeToken<List<ProductEntity>>() {}.type) ?: emptyList()
                      if (list.isNotEmpty()) onRestore(list)
                  }
              }
              Column(Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                  Row(verticalAlignment = Alignment.CenterVertically) { Text("تفعيل الإشعارات", Modifier.weight(1f)); Switch(notif, onNotif) }
                  Row(verticalAlignment = Alignment.CenterVertically) { Text("الوضع الداكن", Modifier.weight(1f)); Switch(isDark, { onTheme() }) }
                  OutlinedTextField(value = def, onValueChange = onDef, label = { Text("أيام التنبيه الافتراضية") }, modifier = Modifier.fillMaxWidth())
                  Button(onClick = {
                      val f = File(ctx.cacheDir, "Backup.json").apply { writeText(Gson().toJson(products)) }
                      val u = FileProvider.getUriForFile(ctx, "${ctx.packageName}.fileprovider", f)
                      ctx.startActivity(Intent.createChooser(Intent(Intent.ACTION_SEND).apply { type = "application/json"; putExtra(Intent.EXTRA_STREAM, u); addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION) }, "نسخ احتياطي"))
                  }, colors = ButtonDefaults.buttonColors(containerColor = EmeraldGreen), modifier = Modifier.fillMaxWidth()) { Text("نسخ احتياطي JSON") }
                  OutlinedButton(onClick = { launcher.launch("application/json") }, modifier = Modifier.fillMaxWidth()) { Text("استعادة JSON") }
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExpiryGuard-2.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
