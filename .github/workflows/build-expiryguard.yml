name: Build ExpiryGuard APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Build ExpiryGuard 2.0
        run: |
          python3 -c '
          import os
          def w(p, c):
              os.makedirs(os.path.dirname(p), exist_ok=True)
              open(p, "w").write(c)

          w("settings.gradle.kts", "pluginManagement{repositories{google();mavenCentral();gradlePluginPortal()}}\ndependencyResolutionManagement{repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS);repositories{google();mavenCentral()}}\nrootProject.name=\"ExpiryGuard2\"\ninclude(\":app\")")
          w("build.gradle.kts", "plugins{id(\"com.android.application\") version \"8.2.2\" apply false;id(\"org.jetbrains.kotlin.android\") version \"1.9.22\" apply false;id(\"com.google.devtools.ksp\") version \"1.9.22-1.0.17\" apply false}")
          w("gradle.properties", "org.gradle.jvmargs=-Xmx2048m\nandroid.useAndroidX=true\nkotlin.code.style=official")
          w("app/build.gradle.kts", """plugins{id("com.android.application");id("org.jetbrains.kotlin.android");id("com.google.devtools.ksp")}
          android{namespace="com.expiryguard.app";compileSdk=34;defaultConfig{applicationId="com.expiryguard.app";minSdk=26;targetSdk=34;versionCode=1;versionName="2.0"}
          compileOptions{sourceCompatibility=JavaVersion.VERSION_17;targetCompatibility=JavaVersion.VERSION_17};kotlinOptions{jvmTarget="17"};buildFeatures{compose=true};composeOptions{kotlinCompilerExtensionVersion="1.5.8"}}
          dependencies{implementation("androidx.core:core-ktx:1.12.0");implementation("androidx.activity:activity-compose:1.8.2");implementation(platform("androidx.compose:compose-bom:2024.02.00"));implementation("androidx.compose.ui:ui");implementation("androidx.compose.material3:material3");implementation("androidx.compose.material:material-icons-extended");implementation("androidx.room:room-runtime:2.6.1");implementation("androidx.room:room-ktx:2.6.1");ksp("androidx.room:room-compiler:2.6.1");implementation("androidx.camera:camera-core:1.3.1");implementation("androidx.camera:camera-camera2:1.3.1");implementation("androidx.camera:camera-lifecycle:1.3.1");implementation("androidx.camera:camera-view:1.3.1");implementation("androidx.work:work-runtime-ktx:2.9.0");implementation("io.coil-kt:coil-compose:2.5.0");implementation("com.google.code.gson:gson:2.10.1")}""")
          w("app/src/main/res/xml/file_paths.xml", "<?xml version=\"1.0\" encoding=\"utf-8\"?><paths><files-path name=\"my_images\" path=\"images/\"/><cache-path name=\"my_exports\" path=\"/\"/></paths>")
          w("app/src/main/res/values/themes.xml", "<?xml version=\"1.0\" encoding=\"utf-8\"?><resources><style name=\"Theme.ExpiryGuard\" parent=\"android:Theme.Material.NoActionBar\"/></resources>")
          w("app/src/main/AndroidManifest.xml", """<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://android.com"><uses-feature android:name="android.hardware.camera" android:required="false"/><uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/><application android:allowBackup="true" android:label="حارس الصلاحية 2.0" android:supportsRtl="true" android:theme="@style/Theme.ExpiryGuard"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity><receiver android:name=".BootReceiver" android:enabled="true" android:exported="true"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/></intent-filter></receiver><provider android:name="androidx.core.content.FileProvider" android:authorities="${applicationId}.fileprovider" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths"/></provider></application></manifest>""")
          '
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ExpiryGuard-2.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
